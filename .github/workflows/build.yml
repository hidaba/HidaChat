name: Build & Verify HidaChat

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore HidaChat.sln

    - name: Build Release configuration
      run: dotnet build HidaChat.sln -c Release --no-restore

    - name: Test session safety policies and cold profile copies
      run: dotnet run --project Tests/HidaChat.SessionTests.vbproj -c Release

    - name: Test passive session diagnostics
      run: node --test Tests/session-health.test.cjs
